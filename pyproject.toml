[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain"
version = "0.1.0"
description = "Second Brain: capture, organize, and retrieve personal knowledge."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "qdrant-client>=1.12,<2",
    # Default keyless providers: LLM via local Claude Code login,
    # embeddings via fastembed (downloads its model on first run).
    "claude-agent-sdk>=0.2.16,<0.3",
    "fastembed>=0.6,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
]

[project.scripts]
brain = "brain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/Query() in parameter defaults is the framework idiom.
"src/brain/api/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import `from tests.fakes import ...`: without the repo root on
# sys.path, the bare `pytest` console script fails with 'No module named
# tests' (only `python -m pytest` adds cwd). Keep plain `pytest` working.
pythonpath = ["."]
