name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # ruff and mypy ship in the dev extra (pyproject [project.optional-dependencies]).
      - name: Install package with dev tools
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src/brain/ai

  test:
    # The suite normally takes ~3 min; 15 caps a hung run (incident 23 Oct:
    # a stalled pytest held a runner for 18+ minutes).
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      # Tests hit the service containers on localhost. The suite pins itself
      # to a *_test database (tests/conftest.py); brain_test is pre-created
      # below so conftest variants that expect it also work.
      DATABASE_URL: postgresql+psycopg://brain:brain@localhost:5432/brain_test
      QDRANT_URL: http://localhost:6333
      # tests/eval/test_calendar_questions.py loads the REAL fastembed model
      # on first use (incident 25 Oct: the unauthenticated HF fetch blew the
      # 60s per-test timeout on a cold runner twice in one day). Pin the
      # cache OUT of /tmp (wiped per runner) into the workspace so
      # actions/cache can persist it. fastembed resolves the dir as
      # FASTEMBED_CACHE_PATH -> <tempdir>/fastembed_cache
      # (fastembed/common/utils.py define_cache_dir, fastembed 0.9.0) and
      # hands it to huggingface_hub snapshot_download(cache_dir=...) —
      # HF_HOME is never consulted on this path.
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed-cache
    services:
      postgres:
        image: postgres:16-alpine  # same tag as docker-compose.yml
        env:
          POSTGRES_USER: brain
          POSTGRES_PASSWORD: brain
          POSTGRES_DB: brain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brain -d brain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.19.1  # same tag as docker-compose.yml
        ports:
          - 6333:6333
          - 6334:6334
        # Image ships no wget/curl; probe the TCP port with bash /dev/tcp.
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Cache the fastembed model
        # The eval model (EVAL_MODEL in tests/eval/test_calendar_questions.py)
        # downloads once into FASTEMBED_CACHE_PATH; the key rolls when the
        # eval file (model name) or the dependency set changes.
        uses: actions/cache@v4
        with:
          path: .fastembed-cache
          key: fastembed-${{ runner.os }}-py3.11-${{ hashFiles('pyproject.toml', 'tests/eval/test_calendar_questions.py') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Create brain_test database
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U brain -d brain -tc \
            "SELECT 1 FROM pg_database WHERE datname = 'brain_test'" | grep -q 1 || \
          docker exec "${{ job.services.postgres.id }}" psql -U brain -d brain \
            -c "CREATE DATABASE brain_test"
      # A real .venv (not just the runner's environment): tests/dev-start
      # interplay expects .venv/bin/{python,alembic,uvicorn} in the repo
      # (scripts/dev-start.sh check_python_env, and the health-probe in
      # tests/test_dev_scripts.py shells out to .venv/bin/python).
      - name: Create .venv and install package
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          # [telegram] extra: runs the poll-loop tests (tests/test_telegram_bot.py)
          .venv/bin/pip install -e '.[dev,telegram]' shellcheck-py
      - name: Apply migrations (brain_test)
        run: .venv/bin/alembic upgrade head
      # The memory-screen behavior tests boot the REAL cockpit files in jsdom
      # (tests/_jsdom_screen.py); without it the harness reports a clean skip,
      # so install once and point node module resolution at it.
      - name: Install jsdom (screen-behavior tests)
        run: npm install --silent --no-save --prefix "$HOME/npm" jsdom@24
      - name: Pytest
        # Plain `pytest` works from the repo root since pyproject sets
        # pytest pythonpath = ["."] (the suite imports tests.fakes).
        # --timeout=60 (thread method) fails AND dumps the stuck test's
        # traceback instead of hanging the runner.
        env:
          NODE_PATH: ${{ env.HOME }}/npm/node_modules
        run: .venv/bin/pytest -q --timeout=60 --timeout-method=thread

  shellcheck:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Same installer the test suite hints at (tests/test_dev_scripts.py).
      - run: pip install shellcheck-py
      - run: shellcheck scripts/*.sh
